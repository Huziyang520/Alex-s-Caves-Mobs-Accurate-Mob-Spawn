# ============================================================
#  Alex's Accurate Mob Spawn - General Settings
# ------------------------------------------------------------
#  All switches below default to ON and take effect immediately after saving;
#  no game restart is needed.
#  The rule files (spawn multiplier / spawn probability) are the other .toml files
#  in this folder.
#  - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
#  Alex's Accurate Mob Spawn - 通用设置
#  三个开关默认全部开启，保存后立刻生效，不需要重启游戏。
#  规则文件（生成倍率 / 生成概率）见本文件夹内的其它 .toml。
# ============================================================

# 是否在每次进入世界时显示模组提示信息
showChatNotice = true

# 倍率功能总开关
#   false = 完全不干预「一次生成几只」（回到原版 / Alex 原版行为）
enableMultiplier = true

# 概率功能总开关
#   false = 完全不干预「生成频率」（回到原版 / Alex 原版行为）
enableProbability = true
